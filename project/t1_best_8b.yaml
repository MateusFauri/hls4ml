ModelName: t1_best_8b
Backend: Vitis
OutputDir: outputs/t1_best_8b
ProjectName: t1_best_8b

#KerasJson: t1_best_8b.json
#KerasH5: t1_best_8b.h5 
InputData: input_features.dat
OutputPredictions: output_predictions.dat


Part: xc7z020clg400-1
ClockPeriod: 10
IOType: io_stream

HLSConfig:

  Model:
    Strategy: Latency
    ReuseFactor: 1

    Precision:
      default: ap_uint<8>

      weight: ap_uint<8>
      bias: ap_uint<8>
      result: ap_uint<8>
      accum: ap_uint<16>

  LayerType:

    Conv2D:
      Strategy: Latency
      ReuseFactor: 1
      Precision:
        weight: ap_uint<8>
        bias: ap_uint<8>
        result: ap_uint<8>
        accum: ap_uint<16>

    Dense:
      Strategy: Latency
      ReuseFactor: 1
      Precision:
        weight: ap_uint<8>
        bias: ap_uint<8>
        result: ap_uint<8>
        accum: ap_uint<16>

  LayerName:

    q_conv2d:
      Trace: True
    batch_normalization:
      Trace: True
    q_activation:
      Trace: True
    q_conv2d_1:
      Trace: True
    batch_normalization_1:
      Trace: True
    q_activation_1:
      Trace: True
    flatten:
      Trace: True
    q_dense:
      Trace: True
    batch_normalization_2:
      Trace: True
    q_activation_2:
      Trace: True
    q_dense_1:
      Trace: True
