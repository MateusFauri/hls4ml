ModelName: t1_best_8b
Backend: Vitis
OutputDir: outputs/t1/8bits
ProjectName: t1_best_8b

KerasH5: models/results/t1/8bits/best/model.h5
InputData: data/hls/t1/8bits/input_features.dat
OutputPredictions: data/hls/t1/8bits/output_predictions.dat

Part: xc7z020clg400-1
ClockPeriod: 10
IOType: io_stream

HLSConfig:
  Model:
    Precision:
      default: int<8>
    ReuseFactor: 1
    Strategy: Latency
    BramFactor: 4096
    TraceOutput: true

  LayerName:
    network_input:
      Trace: true
      Precision:
        result: int<8>

    conv2d_1:
      Trace: true
      Precision:
        weight: int<8>
        bias: int<8>
        accum: int<22>
        result: int<8>

    batch_normalization_1:
      Trace: true
      Precision:
        result: auto
        scale: auto
        bias: auto

    activation_1:
      Trace: true
      Precision:
        result: int<8>

    conv2d_2:
      Trace: true
      Precision:
        weight: int<8>
        bias: int<8>
        accum: int<21>
        result: int<8>

    batch_normalization_2:
      Trace: true
      Precision:
        result: auto
        scale: auto
        bias: auto

    activation_2:
      Trace: true
      Precision:
        result: int<8>

    flatten:
      Trace: true
      Precision:
        result: auto

    dense_1:
      Trace: true
      Precision:
        weight: int<8>
        bias: int<8>
        accum: int<30>
        result: int<8>


    batch_normalization_3:
      Trace: true
      Precision:
        result: auto
        scale: auto
        bias: auto

    activation_3:
      Trace: true
      Precision:
        result: int<8>

    dense_output:
      Trace: true
      Precision:
        weight: int<8>
        bias: int<8>
        accum: int<23>
        result: int<16>

    dense_output_softmax:
      Trace: true
      Precision:
        result: auto
