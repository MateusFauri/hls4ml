ModelName: t1_float
Backend: Vitis
OutputDir: outputs/t1_float
ProjectName: t1_float

# Model section (Keras model)
KerasJson: models/keras/t1_float.json
KerasH5:   models/keras/t1_float_weights.h5 
InputData: models/keras/input_features.dat
OutputPredictions: models/keras/output_predictions.dat

Part: xc7z020clg400-1
ClockPeriod: 10
IOType: io_stream

HLSConfig:

  Model:
    Strategy: Latency
    ReuseFactor: 1
    Trace: True

    Precision:
      default: ap_uint<8>

      weight: ap_uint<2>
      bias: ap_uint<8>
      result: ap_uint<8>
      accum: ap_uint<16>

  LayerType:
    Conv2D:
      Strategy: Latency
      ReuseFactor: 1
      Precision:
        weight: ap_uint<2>
        bias: ap_uint<8>
        result: ap_uint<8>
        accum: ap_uint<16>

    Dense:
      Strategy: Resource
      ReuseFactor: 1
      Precision:
        weight: ap_uint<2>
        bias: ap_uint<8>
        result: ap_uint<8>
        accum: ap_uint<16>

  LayerName:
    conv2d:
      Trace: True

    dense:
      Trace: True